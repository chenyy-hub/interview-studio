<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>面试工作室</title><link rel="stylesheet" href="studio.css"></head>
<body><header><strong>面试工作室 <span>Interview Studio</span></strong><div class="tools"><button id="settings">模型与语音设置</button><button id="overlay">打开悬浮窗</button><button id="start" class="primary">开始采音</button><button id="stop">结束采音</button></div></header>
<div class="layout"><aside><nav id="navigation"><button data-view="connect">服务配置 · 模型与语音</button><button data-view="interview" class="active">面试助手</button><button data-view="written">笔试 / 截图助手</button><button data-view="resume">简历优化</button><button data-view="materials">简历与知识资料</button><button data-view="records">记录与复盘</button><button data-view="setup">语音与术语</button><button data-view="pair">双端互联</button><button data-view="performance">回复速度</button><button data-view="privacy">窗口与共享保护</button><button data-view="diagnostics">链路诊断</button></nav><div class="aside-foot"><p>基于 Pika 桌面内核</p><button id="original">打开 Pika 完整功能页</button><p>本地开发版 · v0.5</p></div></aside><main>
<div id="credential-status" role="status">API Key 默认仅本次使用，退出后不保存。</div>
<div id="status" role="status">正在读取桌面服务…</div>
<section id="work"><div class="title"><div><h1 id="task-title">面试助手</h1><p id="task-description">实时转写、资料增强、流式回答，在一个 App 中完成。</p></div><label><input id="dual" type="checkbox"> 双栏回答（两次请求）</label></div>
<div class="work-grid"><article class="card"><div class="card-head"><b>实时转写</b><button id="export-transcript">导出</button></div><div id="transcripts" class="scroll"><p class="empty">还没有转写。先配置语音服务，再点击「开始采音」。</p></div><div id="partial" class="partial"></div></article>
<article class="card"><div class="card-head"><b id="question-title">回答</b><div><button id="speak">播报快答</button><button id="cancel">停止生成</button></div></div><div id="columns" class="columns scroll"><section><h3>快答要点 <small id="quick-time"></small></h3><pre id="quick">输入问题或点选一条转写，然后生成回答。</pre><button id="copy-quick">复制快答</button></section><section id="deep-column"><h3>展开解释 <small id="deep-time"></small></h3><pre id="deep">双栏开启后显示更完整的解释。</pre><button id="copy-deep">复制解释</button></section></div><div id="attachments"></div><div class="composer"><textarea id="question" aria-label="问题" placeholder="输入问题，或点选左边的转写…"></textarea><div class="row"><button id="capture">选区截图</button><button id="full-capture">全屏截图</button><button id="export-answer">导出回答</button><span class="grow"></span><button id="ask" class="primary">生成回答 ⌘↵</button></div></div></article></div></section>
<section id="other" hidden></section><div id="notice" role="status"></div>
</main></div><script src="renderer.js"></script></body></html>
