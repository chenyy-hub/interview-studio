<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>面试助手 · 悬浮窗</title><link rel="stylesheet" href="overlay.css"></head><body>
<div id="floating-window"><header><div class="drag-label"><span class="grip" aria-hidden="true">⠿</span><strong>面试助手</strong><span id="session-status">未采音</span></div><div class="window-actions"><button id="panel-settings" aria-label="悬浮窗设置" title="悬浮窗设置">设置</button><button id="collapse" aria-label="收起悬浮窗" title="收起 / 展开">⌃</button><button id="close-overlay" aria-label="隐藏悬浮窗" title="隐藏，Ctrl/⌘+Shift+O 恢复">×</button></div></header>
<div id="floating-content"><div class="answer-tabs"><div><button id="quick-tab" class="selected">快答</button><button id="deep-tab">详细解释</button><small id="answer-timing"></small></div><div><button id="show-transcript" aria-expanded="false">转写</button><button id="copy-answer">复制</button></div></div>
<section id="transcript-panel" hidden><div id="last-transcript">开始面试后，这里显示对方最新的发言。</div><div id="partial-transcript"></div><button id="use-transcript">用最新转写提问</button></section>
<main id="answer-scroll"><p id="question-label"></p><pre id="answer-text">点「AI 快答」使用最新转写，或在下方输入问题。\n拖动顶部调整位置，窗口边缘可调整大小。</pre></main>
<div id="attached-images"></div><div id="floating-notice" role="status"></div>
<footer><div class="quick-actions"><button id="quick-answer" class="accent" title="Ctrl/⌘+Shift+A">AI 快答</button><button id="capture-answer" title="Ctrl/⌘+Shift+V">截图提问</button><button id="retry-answer" title="Ctrl/⌘+Shift+R">重新生成</button><button id="stop-answer">停止</button><span class="space"></span><button id="listen">开始面试</button></div><form id="question-form"><textarea id="question-input" rows="1" aria-label="向 AI 提问" placeholder="输入问题，Enter 发送 · Shift+Enter 换行"></textarea><button id="send-question" aria-label="发送问题">↵</button></form></footer></div>
<aside id="settings-panel" hidden><div class="panel-heading"><strong>悬浮窗设置</strong><button id="close-settings" aria-label="关闭悬浮窗设置">×</button></div><div class="presets"><button id="ghost-preset">纯透明淡字</button><button id="clear-preset">清晰阅读</button></div><label>背景不透明度 <output id="background-value">88%</output><input id="background-opacity" type="range" min="0" max="100" value="88" aria-label="背景不透明度"></label><label>文字不透明度 <output id="text-value">100%</output><input id="text-opacity" type="range" min="15" max="100" value="100" aria-label="文字不透明度"></label><label>字号 <output id="font-value">15</output><input id="font-size" type="range" min="12" max="24" value="15" aria-label="悬浮窗字号"></label><div class="options"><label><input id="dual-answer" type="checkbox"> 同时生成详细解释（两次模型请求）</label><button id="click-through">开启鼠标穿透</button><button id="open-main">返回主窗口</button><button id="open-app-settings">API 与语音设置</button></div><p>置顶跟随已开启。拖动顶部、拉动窗口边缘调整大小。背景 0% 时只保留文字和悬停时的控件。</p><details><summary>快捷键与恢复方式</summary><div id="shortcut-list"></div><p>穿透时按 Ctrl/⌘+Shift+U，或右键托盘选择「恢复鼠标点击」。退出悬浮或重启会关闭穿透。</p></details></aside>
<div id="passthrough-badge" hidden>鼠标穿透中 · Ctrl/⌘+Shift+U 恢复</div></div><script src="overlay.js"></script></body></html>
