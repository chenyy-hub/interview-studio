name: Publish Windows Installers

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows Desktop Build run
        required: true
        default: '43575457925'
      source_sha:
        description: Exact production code commit of that build
        required: true
        default: 'c0c8c7f88c1b19ce15fd29bf6bd954a2f753b1ab'
      version:
        description: Existing binary version
        required: true
        default: '0.8.0'

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-windows
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate existing build and release inputs
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          for key, pattern in [('RUN_ID', r'[0-9]+'), ('SOURCE_SHA', r'[0-9a-f]{40}'), ('VERSION', r'[0-9]+\.[0-9]+\.[0-9]+')]:
              if not re.fullmatch(pattern, os.environ[key]):
                  raise SystemExit('Invalid ' + key)
          endpoint = f"repos/{os.environ['GH_REPO']}/actions/runs/{os.environ['RUN_ID']}"
          run = json.loads(subprocess.check_output(['gh', 'api', endpoint]))
          assert run['conclusion'] == 'success' and run['status'] == 'completed', 'Build must pass first'
          assert run['name'] == 'Windows Desktop Build', 'Unexpected build workflow'
          assert run['head_sha'] == os.environ['SOURCE_SHA'], 'Source revision differs from reviewed build'
          assert run['repository']['full_name'] == os.environ['GH_REPO'], 'Unexpected source repository'
          # A trusted publisher creates the tag first. GITHUB_TOKEN must not
          # implicitly create refs pointing across workflow-file revisions.
          tag_endpoint = f"repos/{os.environ['GH_REPO']}/git/ref/tags/v{os.environ['VERSION']}"
          ref = json.loads(subprocess.check_output(['gh', 'api', tag_endpoint]))
          assert ref['object']['type'] == 'commit' and ref['object']['sha'] == os.environ['SOURCE_SHA'], 'Release tag must point to the verified production commit'
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', f"v{os.environ['VERSION']}", '--json', 'isDraft,tagName']))
          assert release['isDraft'] is True, 'A trusted publisher must create the draft release first'
          PY
      - name: Download the verified Windows artifact on GitHub
        run: gh run download "$RUN_ID" --name InterviewStudio-Windows-x64 --dir installers
      - name: Verify both executables against build checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('installers')
          expected = {f"InterviewStudio-{kind}-{os.environ['VERSION']}-x64.exe" for kind in ['Setup', 'Portable']}
          hashes = {}
          for line in (root / 'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
              match = re.fullmatch(r'([0-9a-fA-F]{64})  (.+)', line)
              assert match, 'Invalid checksum line'
              digest, name = match.groups()
              assert name in expected and name not in hashes, 'Unexpected or duplicate file'
              hashes[name] = digest.lower()
          assert set(hashes) == expected, 'Both installer and portable are required'
          for name, digest in hashes.items():
              with (root / name).open('rb') as stream:
                  assert hashlib.file_digest(stream, 'sha256').hexdigest() == digest, name + ': checksum differs'
              print(name, (root / name).stat().st_size, 'bytes: SHA256 passed')
          report = json.loads((root / 'windows-verification.json').read_text())
          assert report['platform'] == 'win32' and report['arch'] == 'x64'
          assert report['nativeBrowserStartup'] == 'passed' and report['packagedDependencies'] == 'passed'
          PY
      - name: Publish individual files without rebuilding
        run: |
          tag="v$VERSION"
          cp "installers/InterviewStudio-Setup-$VERSION-x64.exe" installers/InterviewStudio-Windows-Setup.exe
          cp "installers/InterviewStudio-Portable-$VERSION-x64.exe" installers/InterviewStudio-Windows-Portable.exe
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path('installers/SHA256SUMS.txt')
          text = p.read_text(encoding='utf-8-sig')
          for kind in ['Setup', 'Portable']:
              text = text.replace(f"InterviewStudio-{kind}-{os.environ['VERSION']}-x64.exe", f'InterviewStudio-Windows-{kind}.exe')
          p.write_text(text)
          PY
          cat > release-notes.md <<'NOTES'
          Windows 10/11 x64：下载 InterviewStudio-Windows-Setup.exe 安装版；Portable 是可选的免安装版。

          固定最新版入口：https://github.com/chenyy-hub/interview-studio/releases/latest/download/InterviewStudio-Windows-Setup.exe

          本次仅重新分发已通过检查的原始构建文件，SHA256 与构建记录一致。无需下载包含两份程序的 Actions 压缩包。

          这是开发版本；真实设备音频、飞书/腾讯会议共享保护及真实模型效果尚待实测。
          NOTES
          printf '\n源代码：%s\n构建记录：https://github.com/%s/actions/runs/%s\n' "$SOURCE_SHA" "$GH_REPO" "$RUN_ID" >> release-notes.md
          # Keep release creation/publication with the authorized publisher.
          # The job only uploads verified files into the already-created draft.
          gh release upload "$tag" installers/InterviewStudio-Windows-Setup.exe installers/InterviewStudio-Windows-Portable.exe installers/SHA256SUMS.txt installers/windows-verification.json --clobber
